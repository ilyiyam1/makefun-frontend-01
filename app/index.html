<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Bountyline — a fast, read-only frontend for make.fun bounties: live board, bounty pages, leaderboards and profiles.">
<title>Bountyline — make.fun bounties</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">◆</span> Bountyline</a>
    <span class="brand-sub">a make.fun frontend</span>
    <nav class="topnav" aria-label="Main">
      <a href="#/" data-nav="board">Board</a>
      <a href="#/bounty/makefun-frontend-01">This bounty</a>
    </nav>
    <form class="lookup" id="lookup" action="#/">
      <label class="visually-hidden" for="lookup-handle">Look up an account</label>
      <input id="lookup-handle" name="handle" type="search" placeholder="Account handle…" autocomplete="off" spellcheck="false">
      <button type="submit">Profile</button>
    </form>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer class="pagefoot">
  <p>Reads <a href="https://make.fun">make.fun</a>’s public API only — no sign-in, no writes, no trackers. Data refreshes from the API; answers are cached for a minute and revalidated with ETags.</p>
</footer>
</body>
</html>
